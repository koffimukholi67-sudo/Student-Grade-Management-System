<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f8">
  <title>Student Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef3f8;
      --card: #fff;
      --ink: #12233d;
      --mute: #5d6b80;
      --line: #d5dee9;
      --brand: #1f4fd8;
      --brand-ink: #fff;
      --hi: #d62f4b;
      --md: #e08a00;
      --lo: #2a8f6a;
      --over: #fde8ec;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0f1829;
        --card: #18243a;
        --ink: #e8eef8;
        --mute: #98a6bd;
        --line: #2b3a55;
        --brand: #6c93ff;
        --brand-ink: #0b1426;
        --hi: #ff6b83;
        --md: #f0b040;
        --lo: #52cc9f;
        --over: #3a1d28;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1829;
      --card: #18243a;
      --ink: #e8eef8;
      --mute: #98a6bd;
      --line: #2b3a55;
      --brand: #6c93ff;
      --brand-ink: #0b1426;
      --hi: #ff6b83;
      --md: #f0b040;
      --lo: #52cc9f;
      --over: #3a1d28;
    }

    * { box-sizing: border-box; }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Bricolage Grotesque", system-ui, sans-serif;
    }

    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
    .sub { margin: 0 0 18px; color: var(--mute); }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    .stat b { display: block; font-size: 1.6rem; line-height: 1.1; }
    .stat span { color: var(--mute); font-size: .85rem; }
    .bar { height: 10px; margin-bottom: 6px; overflow: hidden; border-radius: 6px; background: var(--line); }
    .bar i { display: block; width: 0; height: 100%; background: var(--lo); transition: width .3s; }

    #soon, #storage-error {
      margin: 10px 0;
      padding: 10px 12px;
      border-left: 4px solid var(--md);
      border-radius: 6px;
      background: var(--card);
    }

    #soon[hidden], #storage-error[hidden] { display: none; }
    #storage-error { border-left-color: var(--hi); }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin: 14px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
    }

    form .wide { grid-column: 1 / -1; }
    label { display: grid; gap: 3px; color: var(--mute); font-size: .85rem; }
    input, select, textarea, button { color: inherit; font: inherit; }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
    }

    textarea { min-height: 52px; resize: vertical; }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

    button {
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      cursor: pointer;
    }

    button.primary { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); font-weight: 600; }
    button.danger.arm { border-color: var(--hi); background: var(--hi); color: #fff; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tools input { flex: 1 1 180px; width: auto; }
    .tools select { width: auto; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tabs button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

    #list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }

    #list > li {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-left: 6px solid var(--md);
      border-radius: 10px;
      background: var(--card);
    }

    #list > li.p-high { border-left-color: var(--hi); }
    #list > li.p-low { border-left-color: var(--lo); }
    #list > li.overdue { background: var(--over); }
    #list > li.done .t { color: var(--mute); text-decoration: line-through; }
    #list input[type="checkbox"] { width: 22px; height: 22px; margin-top: 3px; }
    .t { overflow-wrap: anywhere; font-size: 1.05rem; font-weight: 600; }
    .meta { color: var(--mute); font-size: .88rem; }
    .meta .late { color: var(--hi); font-weight: 600; }
    .notes { grid-column: 2; overflow-wrap: anywhere; font-size: .92rem; }
    .acts { display: flex; grid-column: 2; flex-wrap: wrap; align-items: center; gap: 6px; }
    .acts select { width: auto; padding: 5px 8px; }
    .acts button { padding: 5px 10px; font-size: .9rem; }
    #list > li.empty { display: block; padding: 28px 10px; border: 2px dashed var(--line); color: var(--mute); text-align: center; }

    @media (prefers-reduced-motion: reduce) {
      .bar i { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Student Task Manager</h1>
    <p class="sub">Add assignments, set deadlines, and watch your progress climb.</p>

    <section class="stats" aria-label="Progress">
      <div class="stat"><b id="sTotal">0</b><span>Total tasks</span></div>
      <div class="stat"><b id="sDone">0</b><span>Completed</span></div>
      <div class="stat"><b id="sOver">0</b><span>Overdue</span></div>
      <div class="stat"><b id="sPct">0%</b><span>Completion rate</span></div>
    </section>
    <div class="bar" role="progressbar" aria-label="Completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
    <div id="soon" role="status" hidden></div>
    <p id="storage-error" role="alert" hidden></p>

    <form id="f">
      <label class="wide">Task title<input id="title" required maxlength="120" placeholder="e.g. Chemistry lab report"></label>
      <label>Course<input id="course" maxlength="40" placeholder="e.g. CHEM 101"></label>
      <label>Due date<input id="due" type="date" required></label>
      <label>Priority
        <select id="pri">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
      <label class="wide">Notes<textarea id="notes" maxlength="400" placeholder="Optional details"></textarea></label>
      <div class="wide">
        <button class="primary" id="save" type="submit">Add task</button>
        <button id="cancel" type="button" hidden>Cancel edit</button>
      </div>
    </form>

    <div class="tools">
      <input id="q" type="search" placeholder="Search title, course, notes" aria-label="Search tasks">
      <select id="sort" aria-label="Sort tasks">
        <option value="due">Sort: due date</option>
        <option value="pri">Sort: priority</option>
        <option value="new">Sort: newest</option>
      </select>
      <button id="theme" type="button">Toggle theme</button>
      <button id="clear" type="button">Clear completed</button>
    </div>

    <div class="tabs" id="tabs" aria-label="Filter tasks">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="todo" aria-pressed="false">To do</button>
      <button type="button" data-f="doing" aria-pressed="false">In progress</button>
      <button type="button" data-f="done" aria-pressed="false">Done</button>
    </div>

    <ul id="list" aria-live="polite"></ul>
  </main>

  <script>
    (() => {
      const storageKey = "stm.tasks.v1";
      const statuses = new Set(["todo", "doing", "done"]);
      const priorities = new Set(["high", "medium", "low"]);
      const elements = Object.fromEntries(
        ["f", "title", "course", "due", "pri", "notes", "save", "cancel", "q", "sort", "tabs", "list", "soon", "storage-error", "clear", "theme", "sTotal", "sDone", "sOver", "sPct", "fill"]
          .map((id) => [id, document.getElementById(id)])
      );
      let tasks = [];
      let filter = "all";
      let editId = null;
      let armedId = null;

      function today() {
        const date = new Date();
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function dateAfter(days) {
        const date = new Date();
        date.setDate(date.getDate() + days);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function formatDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return new Date(year, month - 1, day).toLocaleDateString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric"
        });
      }

      function isValidTask(task) {
        return task && typeof task.id === "string" &&
          typeof task.title === "string" && typeof task.course === "string" &&
          typeof task.due === "string" && /^\d{4}-\d{2}-\d{2}$/.test(task.due) &&
          priorities.has(task.pri) && typeof task.notes === "string" &&
          statuses.has(task.status) && Number.isFinite(task.created);
      }

      function showStorageError(message) {
        elements["storage-error"].textContent = message;
        elements["storage-error"].hidden = !message;
      }

      function saveTasks() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(tasks));
          showStorageError("");
        } catch (error) {
          showStorageError("Your changes could not be saved in this browser. Keep this page open to avoid losing them.");
          console.error("Could not save tasks to browser storage.", error);
        }
      }

      function loadTasks() {
        let stored;
        try {
          stored = localStorage.getItem(storageKey);
        } catch (error) {
          showStorageError("Saved tasks are unavailable in this browser. Changes may not persist after you close this page.");
          console.error("Could not read tasks from browser storage.", error);
          return null;
        }

        if (stored === null) return null;

        try {
          const parsed = JSON.parse(stored);
          if (!Array.isArray(parsed) || !parsed.every(isValidTask)) {
            throw new Error("Saved task data has an invalid format.");
          }
          return parsed;
        } catch (error) {
          showStorageError("Saved tasks could not be loaded because the stored data is invalid.");
          console.error("Could not parse saved tasks.", error);
          return [];
        }
      }

      function newId() {
        return `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
      }

      function isOverdue(task) {
        return task.status !== "done" && task.due < today();
      }

      function createSampleTasks() {
        return [
          { id: newId(), title: "Read chapter 4", course: "History", due: dateAfter(1), pri: "medium", notes: "Take notes on key dates", status: "doing", created: 1 },
          { id: newId(), title: "Submit calculus problem set", course: "MATH 201", due: dateAfter(3), pri: "high", notes: "", status: "todo", created: 2 },
          { id: newId(), title: "Buy lab notebook", course: "CHEM 101", due: dateAfter(-1), pri: "low", notes: "", status: "todo", created: 3 }
        ];
      }

      function updateStats() {
        const total = tasks.length;
        const completed = tasks.filter((task) => task.status === "done").length;
        const overdue = tasks.filter(isOverdue).length;
        const percentage = total ? Math.round(completed / total * 100) : 0;

        elements.sTotal.textContent = total;
        elements.sDone.textContent = completed;
        elements.sOver.textContent = overdue;
        elements.sPct.textContent = `${percentage}%`;
        elements.fill.style.width = `${percentage}%`;
        elements.fill.parentElement.setAttribute("aria-valuenow", String(percentage));

        const dueSoon = tasks.filter((task) =>
          task.status !== "done" && task.due >= today() && task.due <= dateAfter(2)
        ).length;
        const reminders = [];
        if (overdue) reminders.push(`${overdue} overdue`);
        if (dueSoon) reminders.push(`${dueSoon} due within 2 days`);

        elements.soon.textContent = reminders.length ? `Heads up: ${reminders.join(", ")}.` : "";
        elements.soon.hidden = reminders.length === 0;
      }

      function appendTask(task) {
        const item = document.createElement("li");
        item.dataset.id = task.id;
        item.classList.add(`p-${task.pri === "medium" ? "med" : task.pri}`);
        if (task.status === "done") item.classList.add("done");
        if (isOverdue(task)) item.classList.add("overdue");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.dataset.a = "check";
        checkbox.checked = task.status === "done";
        checkbox.setAttribute("aria-label", checkbox.checked ? "Mark task not done" : "Mark task done");
        item.append(checkbox);

        const summary = document.createElement("div");
        const title = document.createElement("div");
        title.className = "t";
        title.textContent = task.title;
        summary.append(title);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${task.course ? `${task.course} · ` : ""}Due ${formatDate(task.due)}`;
        if (isOverdue(task)) {
          const late = document.createElement("span");
          late.className = "late";
          late.textContent = " Overdue";
          meta.append(late);
        }
        meta.append(` · ${task.pri} priority`);
        summary.append(meta);
        item.append(summary);

        if (task.notes) {
          const notes = document.createElement("div");
          notes.className = "notes";
          notes.textContent = task.notes;
          item.append(notes);
        }

        const actions = document.createElement("div");
        actions.className = "acts";

        const status = document.createElement("select");
        status.dataset.a = "status";
        status.setAttribute("aria-label", `Status for ${task.title}`);
        for (const [value, label] of [["todo", "To do"], ["doing", "In progress"], ["done", "Done"]]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          option.selected = task.status === value;
          status.append(option);
        }
        actions.append(status);

        const edit = document.createElement("button");
        edit.type = "button";
        edit.dataset.a = "edit";
        edit.textContent = "Edit";
        actions.append(edit);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.dataset.a = "del";
        remove.className = armedId === task.id ? "danger arm" : "danger";
        remove.textContent = armedId === task.id ? "Confirm delete" : "Delete";
        actions.append(remove);

        item.append(actions);
        elements.list.append(item);
      }

      function render() {
        const query = elements.q.value.trim().toLowerCase();
        const priorityRank = { high: 0, medium: 1, low: 2 };
        const visibleTasks = tasks.filter((task) => {
          if (filter !== "all" && task.status !== filter) return false;
          return !query || `${task.title} ${task.course} ${task.notes}`.toLowerCase().includes(query);
        });

        visibleTasks.sort((first, second) => {
          if (elements.sort.value === "pri") {
            return priorityRank[first.pri] - priorityRank[second.pri] || first.due.localeCompare(second.due);
          }
          if (elements.sort.value === "new") return second.created - first.created;
          return first.due.localeCompare(second.due);
        });

        elements.list.replaceChildren();
        if (!visibleTasks.length) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = tasks.length
            ? "No tasks match this view. Try another filter or search."
            : "No tasks yet. Add your first assignment above.";
          elements.list.append(empty);
        } else {
          visibleTasks.forEach(appendTask);
        }
        updateStats();
      }

      function resetForm() {
        editId = null;
        elements.f.reset();
        elements.pri.value = "medium";
        elements.save.textContent = "Add task";
        elements.cancel.hidden = true;
      }

      function beginEdit(task) {
        elements.title.value = task.title;
        elements.course.value = task.course;
        elements.due.value = task.due;
        elements.pri.value = task.pri;
        elements.notes.value = task.notes;
        editId = task.id;
        elements.save.textContent = "Save changes";
        elements.cancel.hidden = false;
        elements.title.focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      tasks = loadTasks();
      if (tasks === null) {
        tasks = createSampleTasks();
        saveTasks();
      }

      elements.f.addEventListener("submit", (event) => {
        event.preventDefault();
        const data = {
          title: elements.title.value.trim(),
          course: elements.course.value.trim(),
          due: elements.due.value,
          pri: elements.pri.value,
          notes: elements.notes.value.trim()
        };
        if (!data.title || !data.due || !priorities.has(data.pri)) return;

        if (editId) {
          const task = tasks.find((item) => item.id === editId);
          if (task) Object.assign(task, data);
        } else {
          tasks.push({ id: newId(), ...data, status: "todo", created: Date.now() });
        }
        resetForm();
        saveTasks();
        render();
      });

      elements.cancel.addEventListener("click", resetForm);

      elements.list.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const action = target.dataset.a;
        const item = target.closest("li[data-id]");
        if (!action || !item) return;

        const id = item.dataset.id;
        if (action === "del") {
          if (armedId === id) {
            tasks = tasks.filter((task) => task.id !== id);
            armedId = null;
            saveTasks();
          } else {
            armedId = id;
          }
          render();
          return;
        }

        if (action === "edit") {
          const task = tasks.find((itemTask) => itemTask.id === id);
          if (task) beginEdit(task);
        }
      });

      elements.list.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement || target instanceof HTMLSelectElement)) return;
        const action = target.dataset.a;
        const item = target.closest("li[data-id]");
        if (!action || !item) return;

        const task = tasks.find((itemTask) => itemTask.id === item.dataset.id);
        if (!task) return;
        if (action === "check" && target instanceof HTMLInputElement) {
          task.status = target.checked ? "done" : "todo";
        } else if (action === "status" && target instanceof HTMLSelectElement && statuses.has(target.value)) {
          task.status = target.value;
        } else {
          return;
        }
        armedId = null;
        saveTasks();
        render();
      });

      elements.tabs.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const selectedFilter = target.dataset.f;
        if (!selectedFilter) return;
        filter = selectedFilter;
        for (const button of elements.tabs.children) {
          button.setAttribute("aria-pressed", String(button.dataset.f === filter));
        }
        render();
      });

      elements.q.addEventListener("input", render);
      elements.sort.addEventListener("change", render);
      elements.clear.addEventListener("click", () => {
        tasks = tasks.filter((task) => task.status !== "done");
        armedId = null;
        saveTasks();
        render();
      });

      elements.theme.addEventListener("click", () => {
        const root = document.documentElement;
        const isDark = root.getAttribute("data-theme") === "dark" ||
          (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-theme", isDark ? "light" : "dark");
      });

      render();
    })();
  </script>
</body>
</html>
